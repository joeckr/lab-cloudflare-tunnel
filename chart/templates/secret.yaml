{{- if .Values.cloudflare.secretCreate }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lab-cloudflare-tunnel.secretName" . }}
  labels:
    {{- include "lab-cloudflare-tunnel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.cloudflare.secretKey | default "token" }}: {{ .Values.cloudflare.token | quote }}
{{- end }}
