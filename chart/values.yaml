# Default values for lab-cloudflare-tunnel (remotely managed cloudflared tunnel).

cloudflare:
  # Name of the pre-existing Kubernetes Secret containing the tunnel token.
  secretName: "tunnel-token"
  # The key inside the Secret that stores the tunnel token string.
  secretKey: "token"

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  # Tag for cloudflare/cloudflared (defaults to "latest").
  tag: "latest"

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# Hardened pod security context (Kubernetes PSS restricted compliant)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

# Hardened container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

metrics:
  port: 2000

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"

affinity: {}
